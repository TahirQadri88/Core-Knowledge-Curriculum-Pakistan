# A push to any branch except main starts "Deploy to GitHub Pages" (pages.yml) through workflow_run.
# The deploy itself then runs from main, which the github-pages environment allows.
name: Branch pushed

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Branch ${{ github.ref_name }} pushed; Pages will rebuild with its preview."
